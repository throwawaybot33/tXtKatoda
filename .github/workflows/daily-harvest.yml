name: daily-harvest

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run tXtKatoda Harvester
        run: python3 tXtKatoda-Harvester.py --outdir feed --state feed/state.json --timeout 6
      - name: Commit fresh feed
        run: |
          git config user.name "txtkatoda-bot"
          git config user.email "txtkatoda-bot@users.noreply.github.com"
          git add feed/
          git diff --cached --quiet || (git commit -m "feed: daily harvest $(date -u +%F)" && git push)
          
